<title>Ember OS</title>

<style>
:root{--bg:#1c1c1b;--s1:#242423;--s2:#2e2e2c;--bd:#3e3e3a;--tx:#d9d6cf;--dim:#8f8c85;--ac:#d97757;--on:#1c1c1b;--f:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--r:6px;--e:cubic-bezier(.2,.8,.2,1);--d:170ms;--sh:0 14px 40px rgba(0,0,0,.45);--ok:#5fb760;--wn:#e5b94a;--er:#e5635a;--zbar:9000;--zpop:9500;--zdlg:9700;--ztoast:9800;color-scheme:dark}

body{font:var(--fs,13px)/1.5 var(--f);color:var(--tx);background:var(--bg);transition:background var(--d),color var(--d)}

[data-wp=slate] #desk{background:color-mix(in srgb,#3b6aa8 16%,var(--bg))}
[data-wp=ember] #desk{background:color-mix(in srgb,var(--ac) 20%,var(--bg))}
[data-wp=grid] #desk{background:linear-gradient(color-mix(in srgb,var(--tx) 5%,transparent) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,color-mix(in srgb,var(--tx) 5%,transparent) 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
#icons{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:grid;gap:6px}
.sc{width:76px;background:none;border:1px solid transparent;display:grid;justify-items:center;gap:4px;padding:8px 2px;font-size:11px}
.sc svg{width:26px;height:26px;color:var(--ac)}.sc:hover,.sc:focus-visible{background:color-mix(in srgb,var(--tx) 8%,transparent);border-color:var(--bd)}
.win{position:absolute;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);overflow:hidden;transition:opacity var(--d),transform var(--d) var(--e)}
.win.opening{animation:pop var(--d) var(--e)}.win.closing{opacity:0;transform:scale(.97);pointer-events:none}

.dots{display:flex;gap:7px}.dots button{width:12px;height:12px;border-radius:50%;padding:0;background:#807d76;border:0}
.dots button:hover{transform:scale(1.15)}.dots:hover .dc{background:var(--er)}.dots:hover .dm{background:var(--wn)}.dots:hover .dx{background:var(--ok)}
.ti{flex:1;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rz{position:absolute;touch-action:none}.rz.r{right:0;top:34px;bottom:10px;width:5px;cursor:ew-resize}.rz.b{bottom:0;left:0;right:10px;height:5px;cursor:ns-resize}.rz.c{right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize}
.tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);flex:none}.sp{flex:1}
.foot{padding:4px 10px;border-top:1px solid var(--bd);color:var(--dim);font-size:11px;flex:none;min-height:26px}
.crumb{display:flex;align-items:center;flex:1;min-width:0;overflow:hidden}.crumb button{background:none;border:0;padding:1px 4px}
.list{flex:1;overflow:auto;padding:6px;outline:0}.list.grid{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:6px;align-content:start}
.fi{display:grid;grid-template-columns:20px 1fr 70px 130px;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;padding:3px 6px}
.grid .fi{grid-template-columns:1fr;justify-items:center;text-align:center;padding:10px 4px}.grid .fi .m{display:none}
.fi svg{color:var(--ac)}.fi.sel{background:color-mix(in srgb,var(--ac) 18%,transparent);border-color:var(--ac)}.fi .m{color:var(--dim);font-size:11px}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.term{background:#161615;color:#d9d6cf;padding:10px;overflow:auto}.term .out{white-space:pre-wrap;word-break:break-word;flex:1}
.term .dim{color:#8f8c85}.term .err{color:var(--er)}.term .ln{display:flex;gap:8px}.term .ps{color:var(--ac)}.term input{flex:1;border:0;background:none;padding:0;outline:0;color:inherit}
textarea.ed{flex:1;resize:none;border:0;border-radius:0;padding:10px;line-height:1.6;outline:0;tab-size:2}
.calc{padding:10px;gap:8px;outline:0}.cd{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:10px;text-align:right;min-height:72px}
.cd b{display:block;font-size:22px;font-weight:500;word-break:break-all}.cd span{color:var(--dim)}.ck{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ck button{font-size:15px}
.set{padding:14px 18px;overflow:auto}.set h3{margin:14px 0 6px;font-size:12px;color:var(--dim);font-weight:500}.set h3:first-child{margin-top:0}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}
.sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid transparent}.sw[aria-pressed=true]{border-color:var(--tx)}
.kv{display:grid;grid-template-columns:130px 1fr 90px;gap:4px 10px;padding:12px 16px;overflow:auto;align-content:start}.kv .t{font-size:11px;color:var(--dim)}.kv div{word-break:break-word}
.jv{min-height:0}.jv-main{flex:1;display:grid;place-content:center;justify-items:center;gap:18px;padding:16px;text-align:center}
.orb{width:136px;height:136px;border-radius:50%;padding:0;background:var(--s2);border:2px solid var(--bd);display:grid;place-items:center;transition:border-color var(--d),background var(--d)}
.orb-core{width:56px;height:56px;border-radius:50%;background:var(--dim);transition:background var(--d),transform var(--d) var(--e)}
.jv[data-state=listening] .orb{border-color:var(--ac);animation:orbp 1.8s ease-in-out infinite}.jv[data-state=listening] .orb-core{background:var(--ac)}
.jv[data-state=thinking] .orb{border-color:var(--ac);border-style:dashed;animation:spin 3s linear infinite}.jv[data-state=thinking] .orb-core{background:var(--ac);transform:scale(.7)}
.jv[data-state=speaking] .orb{border-color:var(--ac);animation:orbp .9s ease-in-out infinite}.jv[data-state=speaking] .orb-core{background:var(--ac);transform:scale(1.15)}
.jv[data-state=error] .orb{border-color:var(--er)}.jv[data-state=error] .orb-core{background:var(--er)}
@keyframes orbp{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--ac) 16%,transparent)}}
.jcap{min-height:2.6em;max-width:320px;color:var(--dim);font-size:12px}.jcap[hidden]{display:none}.jv .js{font-size:13px;color:var(--tx)}
:root[data-rm="1"] .orb{animation:none!important}.jb.tool{align-self:flex-start;color:var(--dim);font-size:11px;border-style:dashed;background:none;padding:2px 8px}.jc{padding:8px 10px;border-top:1px solid var(--bd);overflow:auto;max-height:55%;display:grid;gap:6px;font-size:12px}.jc[hidden]{display:none}.jr{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:center}.jr input[type=range]{padding:0}.jr input[type=checkbox]{justify-self:start}.jc a{color:var(--ac)}.jc h4{margin:6px 0 0;font-size:12px;color:var(--dim);font-weight:500}.jl{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.jb{max-width:88%;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);white-space:pre-wrap;word-break:break-word}.jb.me{align-self:flex-end;background:color-mix(in srgb,var(--ac) 18%,transparent)}.jb.ai{align-self:flex-start;background:var(--s2)}.js{padding:2px 10px;color:var(--dim);font-size:11px;min-height:18px}.jx{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px}.jx button{font-size:11px}.jf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.jf input{flex:1;min-width:0}.jo{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 8px}.jv button[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.nl{width:210px;border-right:1px solid var(--bd);display:flex;flex-direction:column;flex:none;min-height:0}.ne{flex:1;display:flex;flex-direction:column;min-width:0}
#lock{position:fixed;inset:0;z-index:99000;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;padding:12px;transition:opacity .4s var(--e)}#lock.off{opacity:0;pointer-events:none}
#lock .lw{width:560px;max-width:100%;height:min(320px,90vh);display:flex;flex-direction:column;background:#161615;border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);overflow:hidden;animation:pop var(--d) var(--e)}
#lock .lw .th{cursor:default}#lock .dots i{width:12px;height:12px;border-radius:50%;background:#807d76}
#lock .lb{flex:1;overflow:auto;padding:10px;color:#d9d6cf;word-break:break-word;cursor:text}#lock .lb .dim{color:#8f8c85}#lock .lb .e{color:var(--er)}
#lock .ln{display:flex;align-items:center;position:relative}#lock .ps{color:var(--ac);white-space:nowrap;margin-right:8px}
#lock input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0}#lock .mk{color:#d9d6cf;white-space:pre}#lock .cur{display:inline-block;width:.6em;height:1.15em;margin-left:1px;background:#d9d6cf;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
#lock .lw.bad{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(44px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:4px;padding-left:6px;padding-right:6px;background:var(--s1);border-top:1px solid var(--bd);z-index:var(--zbar)}
#apps{display:flex;gap:2px;flex:1;overflow-x:auto}
.tk{position:relative;background:none;border:0;padding:6px 9px}.tk::after{content:"";position:absolute;bottom:2px;left:50%;width:0;height:2px;border-radius:2px;background:var(--dim);transform:translateX(-50%);transition:width var(--d) var(--e)}
.tk.run::after{width:6px}.tk.act::after{width:16px;background:var(--ac)}.tk:hover{transform:translateY(-1px)}.tk svg{width:18px;height:18px}
#clock{padding:3px 8px;background:none;border:0;text-align:right;font-size:12px;line-height:1.2}
.pop{position:fixed;background:var(--s1);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);z-index:var(--zpop);transform-origin:bottom left;animation:pop var(--d) var(--e)}.pop[hidden]{display:none}
#launch{left:6px;bottom:52px;width:340px;max-width:calc(100vw - 12px);padding:8px}#launch input{width:100%;margin-bottom:6px}
#launch button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px}#launch button.hl{background:color-mix(in srgb,var(--ac) 20%,transparent)}
#launch small{color:var(--dim);margin-left:auto}
#qs{right:6px;bottom:52px;width:240px;padding:10px;display:grid;gap:8px;transform-origin:bottom right}
#ctx{padding:4px;min-width:150px;z-index:var(--zpop)}#ctx button{display:block;width:100%;text-align:left;background:none;border:0}
#toasts{position:fixed;top:12px;right:12px;display:grid;gap:8px;z-index:var(--ztoast);width:300px;max-width:calc(100vw - 24px)}
.toast{background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:var(--r);padding:8px 12px;box-shadow:var(--sh);animation:tin var(--d) var(--e);cursor:pointer;transition:opacity var(--d),transform var(--d)}
.toast.out{opacity:0;transform:translateX(16px)}.toast b{display:block}.toast span{color:var(--dim);font-size:12px}
.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--wn)}.toast.error{border-left-color:var(--er)}
@keyframes tin{from{opacity:0;transform:translateX(24px)}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:var(--zdlg)}
.dlg{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px;width:340px;max-width:92vw;box-shadow:var(--sh);animation:pop var(--d) var(--e)}.dlg input{width:100%;margin-bottom:10px}.dlg .row{display:flex;justify-content:flex-end;gap:8px}
#boot{position:fixed;inset:0;background:#161615;color:#d9d6cf;z-index:99999;display:grid;place-content:center;gap:14px;transition:opacity .5s var(--e)}#boot.off{opacity:0;pointer-events:none}

@keyframes spin{to{transform:rotate(360deg)}}.vh{position:absolute;left:-9999px}
:root[data-rm="1"] *,:root[data-rm="1"] *::before{animation-duration:.01ms!important;transition-duration:.01ms!important}:root[data-rm="1"] .cur,:root[data-rm="1"] #boot h1 i{animation:none!important}
@media(max-width:720px){.fi{grid-template-columns:20px 1fr}.fi .m{display:none}}
</style></head><body>
<div id="boot"><h1><i>✱</i> Ember OS</h1><pre id="bl"></pre></div>
<div id="desk"><div id="icons"></div></div>
<footer id="bar"><button class="tk" id="lb" aria-label="Open app launcher (Alt+Space)" title="Apps (Alt+Space)"></button><div id="apps" role="toolbar" aria-label="Running applications"></div>

/* ---------- import / export / backup (all imported data is untrusted) ---------- */
function dl(name,text,type='text/plain'){const u=URL.createObjectURL(new Blob([text],{type})),a=el('a');a.href=u;a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function pick(accept,multiple){return new Promise(res=>{const i=el('input');i.type='file';i.accept=accept;i.multiple=!!multiple;i.style.display='none';document.body.append(i);i.onchange=()=>{res([...i.files]);i.remove()};i.oncancel=()=>{res([]);i.remove()};i.click()})}
function uniq(parent,name){name=name.replace(/[\/\\]/g,'_').trim()||'imported.txt';if(name==='.'||name==='..')name='imported.txt';const dot=name.lastIndexOf('.'),base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';let n=name.slice(0,64),i=1;while(kids(parent).some(k=>k.name===n)){n=(base.slice(0,Math.max(1,56-ext.length))+' ('+(++i)+')'+ext).slice(0,64)}return n}
function validFs(x){if(!x||typeof x!=='object'||Array.isArray(x))return'The backup has no valid file system.';const ids=Object.keys(x);if(ids.length>10000)return'The backup has too many items.';let size=0;const seen=new Set();
for(const id of ids){const n=x[id];if(!/^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$/.test(id))return'The backup contains an invalid item id.';if(!n||typeof n!=='object'||n.id!==id)return'The backup contains an invalid item.';
if(typeof n.name!=='string'||n.name.length>64||(id!=='r'&&(!n.name||/[\/\\]/.test(n.name)||n.name==='.'||n.name==='..')))return'The backup contains an invalid name.';
if(n.type!=='dir'&&n.type!=='file')return'The backup contains an invalid item type.';if(typeof n.m!=='number'||!isFinite(n.m))return'The backup contains an invalid date.';
if(n.type==='file'){if(typeof n.content!=='string')return'The backup contains invalid file content.';size+=n.content.length}else if('content' in n)return'The backup contains a folder with content.';
if(n.o!==undefined&&typeof n.o!=='string')return'The backup contains an invalid field.';
if(id==='r'){if(n.parent!==null)return'The backup has an invalid root folder.'}else{if(typeof n.parent!=='string'||!Object.hasOwn(x,n.parent)||x[n.parent].type!=='dir')return'The backup contains an item without a valid folder.';const k=n.parent+'/'+n.name;if(seen.has(k))return'The backup contains duplicate names.';seen.add(k)}}
if(size>50*1024*1024)return'The backup is larger than 50 MB.';
for(const id of ids){let c=id,i=0;while(x[c].parent!==null){c=x[c].parent;if(++i>ids.length)return'The backup contains a folder loop.'}}
for(const k of['r','h','t'])if(!Object.hasOwn(x,k)||x[k].type!=='dir')return'The backup is missing a system folder.';return null}
function validNotes(a){if(!Array.isArray(a)||a.length>5000)return'The backup has invalid notes.';for(const n of a)if(!n||typeof n.id!=='string'||n.id.length>64||typeof n.t!=='string'||n.t.length>200||typeof n.b!=='string'||n.b.length>2000000||typeof n.m!=='number')return'The backup has invalid notes.';return null}
const cleanFs=x=>{const o={};for(const id of Object.keys(x)){const n=x[id];o[id]={id,name:n.name,type:n.type,parent:n.parent,m:n.m,...(n.type==='file'?{content:n.content}:{}),...(typeof n.o==='string'?{o:n.o}:{})}}return o};

/* ---------- full screen (browsers require a click or key press first) ---------- */
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function goFull(){const r=document.documentElement,f=r.requestFullscreen||r.webkitRequestFullscreen;if(!f)return Promise.reject(new Error('This browser does not support full screen.'));try{return Promise.resolve(f.call(r))}catch(e){return Promise.reject(e)}}
function leaveFull(){const f=document.exitFullscreen||document.webkitExitFullscreen;return f?Promise.resolve(f.call(document)):Promise.resolve()}
let autoTried=false;
const autoFull=()=>{if(autoTried||!S.fullscreen||fsOn())return;autoTried=true;goFull().catch(e=>notify('Full screen blocked',(e&&e.message)||'The browser did not allow full screen. Use Settings to try again.','warn'))};

/* ---------- lock screen (prototype, client-side only) ---------- */
const SALT='ember-os:v1:';
async function hashPw(p){try{if(globalThis.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return null}
async function checkPw(p){const h=store.get('pw',null);if(typeof h==='string'&&h)return(await hashPw(p))===h;return p==='1234'}
function showLock(first){if($('#lock'))return;const body=document.body;body.classList.add('locked');$('#desk').inert=true;$('#bar').inert=true;L.hidden=true;Q.hidden=true;
const m=el('div');m.id='lock';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Sign in');
m.innerHTML='<div class="lw"><header class="th"><div class="dots"><i></i><i></i><i></i></div><span class="ti">login \u2014 ember</span></header><div class="lb" role="log"><div class="out"></div><form class="ln"><span class="ps">guest@ember password:</span><span class="mk"></span><span class="cur"></span><input type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Password for guest"></form></div></div>';
body.append(m);const out=$('.out',m),lb=$('.lb',m),lw=$('.lw',m),f=$('form',m),inp=$('input',m);let fails=0,wait=0;
const pr=(t,k='')=>{const d=el('div',k,T(t));out.append(d);lb.scrollTop=1e9;return d};
pr('Ember OS 0.1 (prototype) \u2014 sign in','dim');pr('Account: guest. Typing is masked.','dim');if(!store.get('pw',null))pr('Default password: 1234','dim');if(S.fullscreen&&!fsOn())pr('Full screen starts with your first key press.','dim');pr('');
lb.onclick=()=>{if(!getSelection().toString())inp.focus()};const mk=$('.mk',m);inp.oninput=()=>{mk.textContent='*'.repeat(inp.value.length)};
f.onsubmit=async e=>{e.preventDefault();if(wait)return;const v=inp.value;inp.value='';pr('guest@ember password:'+(v?' '+'*'.repeat(v.length):''),'dim');mk.textContent='';if(!v)return;
if(await checkPw(v)){pr('Welcome, guest.');inp.disabled=true;m.classList.add('off');body.classList.remove('locked');body.classList.add('on');$('#desk').inert=false;$('#bar').inert=false;if(first)openApp('files');else if(act)focus(act);setTimeout(()=>m.remove(),S.rm?0:450);return}
fails++;pr('Login incorrect','e');lw.classList.remove('bad');void lw.offsetWidth;lw.classList.add('bad');
if(fails>=3){wait=Math.min(30,(fails-2)*3);inp.disabled=true;const l=pr('','e'),tx=()=>{l.textContent=T('Too many attempts. Try again in {0}s.').replace('{0}',wait)};tx();const t=setInterval(()=>{wait--;if(wait<=0){clearInterval(t);wait=0;l.remove();inp.disabled=false;inp.focus()}else tx()},1000)}};
inp.focus()}
const lines=['mounting virtual filesystem … ok','loading preferences … ok','registering '+Object.keys(APPS).length+' apps … ok','starting desktop'],bl=$('#bl');
let li=0;const step=()=>{if(li<lines.length){bl.textContent+=lines[li++]+'\n';setTimeout(step,S.rm?0:260)}else{Promise.race([fsReady,new Promise(r=>setTimeout(()=>{fsTimedOut=true;r()},5000))]).then(()=>{$('#boot').classList.add('off');showLock(true);setTimeout(()=>$('#boot').remove(),S.rm?0:500)})}};step();
