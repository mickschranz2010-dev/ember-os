<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ember OS</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1c1b;--s1:#242423;--s2:#2e2e2c;--bd:#3e3e3a;--tx:#d9d6cf;--dim:#8f8c85;--ac:#d97757;--on:#1c1c1b;--f:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--r:6px;--e:cubic-bezier(.2,.8,.2,1);--d:170ms;--sh:0 14px 40px rgba(0,0,0,.45);--ok:#5fb760;--wn:#e5b94a;--er:#e5635a;--zbar:9000;--zpop:9500;--zdlg:9700;--ztoast:9800;color-scheme:dark}
:root[data-theme=light]{--bg:#eeece6;--s1:#f7f6f2;--s2:#e5e2da;--bd:#cdc9bf;--tx:#2a2926;--dim:#6d6962;--sh:0 14px 40px rgba(0,0,0,.18);color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{font:13px/1.5 var(--f);color:var(--tx);background:var(--bg);transition:background var(--d),color var(--d)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:3px 9px;cursor:pointer;transition:background var(--d),transform var(--d) var(--e)}
button:hover{background:color-mix(in srgb,var(--tx) 10%,var(--s2))}button:active{transform:scale(.97)}
button.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:3px 8px}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
#desk{position:fixed;inset:0 0 44px 0;background:var(--bg);opacity:0;transition:opacity .5s var(--e)}
body.on #desk{opacity:1}
[data-wp=slate] #desk{background:color-mix(in srgb,#3b6aa8 16%,var(--bg))}
[data-wp=ember] #desk{background:color-mix(in srgb,var(--ac) 20%,var(--bg))}
[data-wp=grid] #desk{background:linear-gradient(color-mix(in srgb,var(--tx) 5%,transparent) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,color-mix(in srgb,var(--tx) 5%,transparent) 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
#icons{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:grid;gap:6px}
.sc{width:76px;background:none;border:1px solid transparent;display:grid;justify-items:center;gap:4px;padding:8px 2px;font-size:11px}
.sc svg{width:26px;height:26px;color:var(--ac)}.sc:hover,.sc:focus-visible{background:color-mix(in srgb,var(--tx) 8%,transparent);border-color:var(--bd)}
.win{position:absolute;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);overflow:hidden;transition:opacity var(--d),transform var(--d) var(--e)}
.win.opening{animation:pop var(--d) var(--e)}.win.closing{opacity:0;transform:scale(.97);pointer-events:none}
.win.min{opacity:0;transform:translateY(24px) scale(.96);pointer-events:none}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.win:not(.act){border-color:color-mix(in srgb,var(--bd) 60%,transparent)}.win.act{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(6px)}}
.th{display:flex;align-items:center;gap:12px;height:34px;padding:0 12px;background:var(--s2);border-bottom:1px solid var(--bd);cursor:grab;user-select:none;touch-action:none;flex:none}
.dots{display:flex;gap:7px}.dots button{width:12px;height:12px;border-radius:50%;padding:0;background:#807d76;border:0}
.dots button:hover{transform:scale(1.15)}.dots:hover .dc{background:var(--er)}.dots:hover .dm{background:var(--wn)}.dots:hover .dx{background:var(--ok)}
.ti{flex:1;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rz{position:absolute;touch-action:none}.rz.r{right:0;top:34px;bottom:10px;width:5px;cursor:ew-resize}.rz.b{bottom:0;left:0;right:10px;height:5px;cursor:ns-resize}.rz.c{right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize}
.tb{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);flex:none}.sp{flex:1}
.foot{padding:4px 10px;border-top:1px solid var(--bd);color:var(--dim);font-size:11px;flex:none;min-height:26px}
.crumb{display:flex;align-items:center;flex:1;min-width:0;overflow:hidden}.crumb button{background:none;border:0;padding:1px 4px}
.list{flex:1;overflow:auto;padding:6px;outline:0}.list.grid{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:6px;align-content:start}
.fi{display:grid;grid-template-columns:20px 1fr 70px 130px;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;padding:3px 6px}
.grid .fi{grid-template-columns:1fr;justify-items:center;text-align:center;padding:10px 4px}.grid .fi .m{display:none}
.fi svg{color:var(--ac)}.fi.sel{background:color-mix(in srgb,var(--ac) 18%,transparent);border-color:var(--ac)}.fi .m{color:var(--dim);font-size:11px}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.term{background:#161615;color:#d9d6cf;padding:10px;overflow:auto}.term .out{white-space:pre-wrap;word-break:break-word;flex:1}
.term .dim{color:#8f8c85}.term .err{color:var(--er)}.term .ln{display:flex;gap:8px}.term .ps{color:var(--ac)}.term input{flex:1;border:0;background:none;padding:0;outline:0;color:inherit}
textarea.ed{flex:1;resize:none;border:0;border-radius:0;padding:10px;line-height:1.6;outline:0;tab-size:2}
.calc{padding:10px;gap:8px;outline:0}.cd{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:10px;text-align:right;min-height:72px}
.cd b{display:block;font-size:22px;font-weight:500;word-break:break-all}.cd span{color:var(--dim)}.ck{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ck button{font-size:15px}
.set{padding:14px 18px;overflow:auto}.set h3{margin:14px 0 6px;font-size:12px;color:var(--dim);font-weight:500}.set h3:first-child{margin-top:0}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}
.sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid transparent}.sw[aria-pressed=true]{border-color:var(--tx)}
.kv{display:grid;grid-template-columns:130px 1fr 90px;gap:4px 10px;padding:12px 16px;overflow:auto;align-content:start}.kv .t{font-size:11px;color:var(--dim)}.kv div{word-break:break-word}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(44px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:4px;padding-left:6px;padding-right:6px;background:var(--s1);border-top:1px solid var(--bd);z-index:var(--zbar)}
#apps{display:flex;gap:2px;flex:1;overflow-x:auto}
.tk{position:relative;background:none;border:0;padding:6px 9px}.tk::after{content:"";position:absolute;bottom:2px;left:50%;width:0;height:2px;border-radius:2px;background:var(--dim);transform:translateX(-50%);transition:width var(--d) var(--e)}
.tk.run::after{width:6px}.tk.act::after{width:16px;background:var(--ac)}.tk:hover{transform:translateY(-1px)}.tk svg{width:18px;height:18px}
#clock{padding:3px 8px;background:none;border:0;text-align:right;font-size:12px;line-height:1.2}
.pop{position:fixed;background:var(--s1);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);z-index:var(--zpop);transform-origin:bottom left;animation:pop var(--d) var(--e)}.pop[hidden]{display:none}
#launch{left:6px;bottom:52px;width:340px;max-width:calc(100vw - 12px);padding:8px}#launch input{width:100%;margin-bottom:6px}
#launch button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px}#launch button.hl{background:color-mix(in srgb,var(--ac) 20%,transparent)}
#launch small{color:var(--dim);margin-left:auto}
#qs{right:6px;bottom:52px;width:240px;padding:10px;display:grid;gap:8px;transform-origin:bottom right}
#ctx{padding:4px;min-width:150px;z-index:var(--zpop)}#ctx button{display:block;width:100%;text-align:left;background:none;border:0}
#toasts{position:fixed;top:12px;right:12px;display:grid;gap:8px;z-index:var(--ztoast);width:300px;max-width:calc(100vw - 24px)}
.toast{background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:var(--r);padding:8px 12px;box-shadow:var(--sh);animation:tin var(--d) var(--e);cursor:pointer;transition:opacity var(--d),transform var(--d)}
.toast.out{opacity:0;transform:translateX(16px)}.toast b{display:block}.toast span{color:var(--dim);font-size:12px}
.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--wn)}.toast.error{border-left-color:var(--er)}
@keyframes tin{from{opacity:0;transform:translateX(24px)}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:var(--zdlg)}
.dlg{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px;width:340px;max-width:92vw;box-shadow:var(--sh);animation:pop var(--d) var(--e)}.dlg input{width:100%;margin-bottom:10px}.dlg .row{display:flex;justify-content:flex-end;gap:8px}
#boot{position:fixed;inset:0;background:#161615;color:#d9d6cf;z-index:99999;display:grid;place-content:center;gap:14px;transition:opacity .5s var(--e)}#boot.off{opacity:0;pointer-events:none}
#boot h1{margin:0;font-size:22px;font-weight:600}#boot h1 i{color:#d97757;font-style:normal;display:inline-block;animation:spin 3s linear infinite}#boot pre{margin:0;color:#8f8c85;min-height:5.2em;font:inherit}
@keyframes spin{to{transform:rotate(360deg)}}.vh{position:absolute;left:-9999px}
:root[data-rm="1"] *,:root[data-rm="1"] *::before{animation-duration:.01ms!important;transition-duration:.01ms!important}
@media(max-width:720px){.fi{grid-template-columns:20px 1fr}.fi .m{display:none}}
</style></head><body>
<div id="boot"><h1><i>✱</i> Ember OS</h1><pre id="bl"></pre></div>
<div id="desk"><div id="icons"></div></div>
<footer id="bar"><button class="tk" id="lb" aria-label="Open app launcher (Alt+Space)" title="Apps (Alt+Space)"></button><div id="apps" role="toolbar" aria-label="Running applications"></div>
<button class="tk" id="qb" aria-label="Quick settings"></button><button id="clock" aria-label="Clock"></button></footer>
<div class="pop" id="launch" hidden role="dialog" aria-label="App launcher"></div>
<div class="pop" id="qs" hidden role="dialog" aria-label="Quick settings"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const P={files:'M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',file:'M6 3h8l5 5v13H6zM14 3v5h5',terminal:'M4 17l6-5-6-5M12 19h8',editor:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',settings:'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4',calc:'M6 3h12v18H6zM9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01',system:'M4 5h16v11H4zM9 20h6M12 16v4',star:'M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9',up:'M12 19V5M6 11l6-6 6 6',grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',list:'M4 6h16M4 12h16M4 18h16',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
/* ---------- storage (every access guarded) ---------- */
const store={get(k,d){try{const v=localStorage.getItem('ember:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
set(k,v){try{localStorage.setItem('ember:'+k,JSON.stringify(v));return true}catch(e){if(!store.warned){store.warned=1;notify('Storage unavailable','Changes will last only until you close this tab ('+e.name+').','error')}return false}},
del(k){try{localStorage.removeItem('ember:'+k)}catch(e){}}};
/* ---------- notifications ---------- */
function notify(title,msg='',type='info'){const t=el('div','toast '+type);t.append(el('b','',title),el('span','',msg));t.setAttribute('role',type==='error'?'alert':'status');
const go=()=>{t.classList.add('out');setTimeout(()=>t.remove(),180)};t.onclick=go;$('#toasts').prepend(t);setTimeout(go,4500)}
/* ---------- settings ---------- */
const DEF={accent:'#d97757',theme:'dark',wp:'char',h24:true,rm:matchMedia('(prefers-reduced-motion:reduce)').matches};
let S={...DEF,...store.get('settings',{})};
function apply(){const r=document.documentElement;r.style.setProperty('--ac',S.accent);r.dataset.theme=S.theme;r.dataset.rm=S.rm?1:0;document.body.dataset.wp=S.wp;store.set('settings',S);tick()}
const set=(k,v)=>{S[k]=v;apply()};
/* ---------- virtual filesystem (not the real disk) ---------- */
const seed=()=>{const m=Date.now(),d=(id,name,parent)=>({id,name,type:'dir',parent,m});return{r:{id:'r',name:'/',type:'dir',parent:null,m},h:d('h','home','r'),d:d('d','documents','h'),t:d('t','trash','r'),
w:{id:'w',name:'welcome.txt',type:'file',parent:'h',m,content:'Welcome to Ember OS.\n\nThis is a browser-based desktop. Files live in a virtual filesystem stored in this browser (localStorage). Nothing here touches your real disk.\n\nTry: open Terminal and type "help".'}}};
let fs=store.get('fs',null);if(!fs||!fs.r||!fs.h||!fs.t)fs=seed();
const saveFs=()=>store.set('fs',fs),kids=p=>Object.values(fs).filter(n=>n.parent===p),isDir=id=>fs[id]&&fs[id].type==='dir';
const path=id=>{const a=[];for(let n=fs[id];n&&n.parent;n=fs[n.parent])a.unshift(n.name);return'/'+a.join('/')};
function find(p,cwd){let n=p.startsWith('/')?'r':cwd;for(const s of p.split('/')){if(!s||s==='.')continue;if(s==='..'){n=fs[n].parent||n;continue}const k=kids(n).find(x=>x.name===s);if(!k)return null;n=k.id}return n}
function mk(parent,name,type,content=''){name=(name||'').trim();if(!name)throw Error('Name cannot be empty.');if(/[\/\\]/.test(name)||name.length>64||name==='.'||name==='..')throw Error('Names cannot contain slashes or exceed 64 characters.');
if(kids(parent).some(k=>k.name===name))throw Error(`"${name}" already exists here.`);const id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);fs[id]={id,name,type,parent,m:Date.now(),...(type==='file'?{content}:{})};saveFs();return id}
function trash(id){const n=fs[id];if(!n||id==='r'||id==='h'||id==='t')throw Error('That item is protected.');let nm=n.name;while(kids('t').some(k=>k.name===nm))nm+='~';n.o=n.parent;n.name=nm;n.parent='t';saveFs()}
function purge(id){kids(id).forEach(k=>purge(k.id));delete fs[id]}
/* ---------- dialogs & menus ---------- */
function dlg(msg,{input,ok='OK'}={}){return new Promise(res=>{const b=el('div','scrim'),d=el('div','dlg');d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.append(el('p','',msg));let i;if(input!=null){i=el('input');i.value=input;d.append(i)}
const r=el('div','row'),bo=el('button','pri',ok),bc=el('button','','Cancel');r.append(bc,bo);d.append(r);b.append(d);document.body.append(b);const done=v=>{b.remove();res(v)};
bo.onclick=()=>done(i?i.value:true);bc.onclick=()=>done(null);b.onkeydown=e=>{if(e.key==='Escape')done(null);else if(e.key==='Enter'&&e.target===i)bo.click()};(i||bo).focus();i&&i.select()})}
function ctx(x,y,items){$('#ctx')?.remove();const m=el('div','pop');m.id='ctx';items.forEach(([l,f])=>{const b=el('button','',l);b.onclick=()=>{m.remove();f()};m.append(b)});document.body.append(m);
m.style.left=Math.min(x,innerWidth-170)+'px';m.style.top=Math.min(y,innerHeight-items.length*30-60)+'px';m.style.transformOrigin='top left';m.firstChild?.focus();
setTimeout(()=>addEventListener('pointerdown',()=>m.remove(),{once:true}),0)}
/* ---------- window manager ---------- */
const APPS={},wins=new Map();let zc=10,act=null,uid=0;const PIN=['files','terminal','editor','settings'];
const registerApp=(id,a)=>{APPS[id]={id,...a}};
const BAR=44;
function place(w){const e=w.el;e.style.left=w.x+'px';e.style.top=w.y+'px';e.style.width=w.w+'px';e.style.height=w.h+'px';e.classList.toggle('max',w.max);e.classList.toggle('min',w.min)}
function clamp(w){w.w=Math.min(w.w,innerWidth);w.h=Math.min(w.h,innerHeight-BAR);w.x=Math.max(60-w.w,Math.min(w.x,innerWidth-60));w.y=Math.max(0,Math.min(w.y,innerHeight-BAR-34))}
function openApp(id,o={}){const A=APPS[id];if(!A)throw Error('Unknown app: '+id);
if(o.file)for(const w of wins.values())if(w.app===id&&w.o.file===o.file){focus(w.id);return w}
const n=wins.size%6*28,small=innerWidth<720,w={id:++uid,app:id,o,x:50+n,y:30+n,w:A.w,h:A.h,min:false,max:small,z:0};clamp(w);
const e=w.el=el('section','win opening');e.setAttribute('role','dialog');e.setAttribute('aria-label',A.name);
e.innerHTML='<header class="th"><div class="dots"><button class="dc" aria-label="Close"></button><button class="dm" aria-label="Minimize"></button><button class="dx" aria-label="Maximize"></button></div><span class="ti"></span></header><div class="body"></div><i class="rz r"></i><i class="rz b"></i><i class="rz c"></i>';
w.body=$('.body',e);w.setTitle=t=>{$('.ti',e).textContent=t};w.setTitle(A.name);
$('.dc',e).onclick=()=>close(w.id);$('.dm',e).onclick=()=>{w.min=true;place(w);if(act===w.id)focusTop();bar()};$('.dx',e).onclick=()=>toggleMax(w);
$('.th',e).ondblclick=ev=>{if(!ev.target.closest('button'))toggleMax(w)};
e.addEventListener('pointerdown',()=>{if(act!==w.id)focus(w.id)},true);
drag($('.th',e),w,(ev,s)=>{if(w.max)return;w.x=s.x+ev.clientX-s.px;w.y=s.y+ev.clientY-s.py;clamp(w);place(w)},ev=>!ev.target.closest('button'));
[['r',1,0],['b',0,1],['c',1,1]].forEach(([c,dx,dy])=>drag($('.rz.'+c,e),w,(ev,s)=>{if(w.max)return;const mw=Math.min(320,innerWidth),mh=Math.min(200,innerHeight-BAR);
if(dx)w.w=Math.max(mw,s.w+ev.clientX-s.px);if(dy)w.h=Math.max(mh,s.h+ev.clientY-s.py);place(w)}));
wins.set(w.id,w);$('#desk').append(e);
try{A.mount(w.body,w,o)}catch(err){w.body.replaceChildren(el('div','empty','This app failed to load: '+err.message));console.error(err)}
place(w);focus(w.id);return w}
function drag(h,w,fn,ok=()=>true){h.addEventListener('pointerdown',ev=>{if(!ok(ev)||ev.button)return;const s={x:w.x,y:w.y,w:w.w,h:w.h,px:ev.clientX,py:ev.clientY};h.setPointerCapture(ev.pointerId);
const mv=m=>fn(m,s),up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up)};h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)})}
function toggleMax(w){w.max=!w.max;place(w)}
function focus(id){const w=wins.get(id);if(!w)return;w.min=false;w.z=++zc;w.el.style.zIndex=w.z;act=id;wins.forEach(x=>x.el.classList.toggle('act',x.id===id));place(w);bar()}
function focusTop(){const v=[...wins.values()].filter(w=>!w.min).sort((a,b)=>b.z-a.z)[0];if(v)focus(v.id);else{act=null;wins.forEach(x=>x.el.classList.remove('act'))}bar()}
function close(id){const w=wins.get(id);if(!w)return;w.dispose&&w.dispose();wins.delete(id);const e=w.el;e.classList.add('closing');setTimeout(()=>e.remove(),S.rm?0:170);if(act===id)focusTop();else bar()}
addEventListener('resize',()=>wins.forEach(w=>{clamp(w);place(w)}));
/* ---------- taskbar, launcher, quick settings ---------- */
$('#lb').innerHTML=ic('star');$('#qb').innerHTML=ic('sun');
function bar(){const run=[...new Set([...wins.values()].map(w=>w.app))],ids=[...PIN,...run.filter(a=>!PIN.includes(a))],box=$('#apps');box.replaceChildren();
